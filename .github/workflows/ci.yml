name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "11 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # dependency-free engine check (no network):
      - run: |
          mkdir -p build
          javac -d build $(find src/main/java src/test/java -name "*.java" ! -name DetectorApp.java ! -name RuleEngineTest.java)
          java -cp build aegis.detect.Harness
      # full suite + consumer build:
      - run: mvn -B test
